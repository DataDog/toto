[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toto-ts"
version = "0.2.0"
description = "Time-Series-Optimized Transformer for Observability"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "DataDog, Inc."}
]
dependencies = [
    "torch[cuda]>=2.7.0,<3",
    "einops>=0.7.0,<1",
    "gluonts[torch]>=0.15.1,<1",
    "jaxtyping>=0.2.29,<1",
    "pandas>=2.2.3,<3",
    "rotary-embedding-torch~=0.8.6",
    "types-tabulate==0.9.0.20241207",
    "tqdm>=4.66.3,<5",
    "tabulate>=0.9.0,<1",
    "transformers~=4.52.1",


]

[project.optional-dependencies]
all = [
    "aioboto3~=12.4.0",
    "boto3~=1.34.69",
    "datasets~=2.17.1",
    "dill~=0.3.8",
    "scikit-learn>=1.5.0,<2",
    "PyYAML>=6.0.2,<7",
    "types-PyYAML==6.0.12.20240917",

]
dev = [
    "beartype~=0.18.5",
    "mypy>=1.11.1,<2",
    "pytest>=8.3.5,<9",
    "pytest-env>=1.1.5,<2",
    "mypy>=1.11.1,<2",
    "black~=24.10.0",
    "isort~=5.13.2",
    "jupyter~=1.1.1",
    "matplotlib>=3.9.2,<4",
]

[tool.setuptools.packages.find]
include = ["*"]

[tool.black]
# https://black.readthedocs.io/en/stable/usage_and_configuration/the_basics.html#command-line-options
# default is 88
line-length = 120
# default is per-file auto-detection
target-version = ['py310']
include = '\.py$'

[tool.isort]
profile = "black"
